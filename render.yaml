# Frontend is deployed on Vercel — see RENDER.md for full deployment guide
# Backend only is managed by this file

services:
  - type: web
    name: prepiq-backend
    runtime: python
    buildCommand: >-
      pip install torch==2.2.2 torchvision==0.17.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: PYRONITES_URL
        value: https://pyrocore-backend.onrender.com
      - key: PYRONITES_KEY
        sync: false
      - key: PYRONITES_PROJECT_ID
        value: 0c416980-d323-48cf-8b8a-1ffb07b751a7
      - key: JWT_SECRET
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: HEALTH_ENDPOINT
        value: https://prepiq-narg.onrender.com/health
      - key: PYTHONUNBUFFERED
        value: "1"
